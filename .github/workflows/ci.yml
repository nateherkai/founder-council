name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: npm run check
      - name: Viewer smoke test
        run: npm run ci:smoke
      - name: Hybrid resume smoke test
        run: npm run resume:smoke
      - name: Hybrid server progress/stop smoke test
        run: npm run hybrid:server:smoke

  launcher-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PowerShell launcher smoke test
        shell: powershell
        run: .\scripts\launcher-smoke.ps1
